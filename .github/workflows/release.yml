name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    # Two independent locks, not one: the "release" environment (Settings -> Environments)
    # requires iam-saiteja's approval before this job runs at all, and this condition means
    # anyone else who somehow triggers the workflow gets an immediate no-op, not a pending
    # approval request sitting in their name.
    if: github.actor == 'iam-saiteja'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Compute the next version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          if [ -z "$latest" ]; then
            major=0; minor=1; patch=0
          else
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          fi
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "Previous release: ${latest:-none}. New: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p compute-pool-cli

      - name: Package the exe under its version
        shell: bash
        run: |
          mkdir dist
          cp target/release/compute-pool.exe "dist/compute-pool-${{ steps.ver.outputs.tag }}.exe"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/* \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
