[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-pool"
version = "0.2.0"
description = "Native High-Performance GPU Cluster & Compute Pool Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["compute_pool*"]

[tool.ruff]
line-length = 100
target-version = "py310"
