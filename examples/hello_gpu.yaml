# Example Compute Pool job spec
# Submit with: compute-pool job submit examples/hello_gpu.yaml

job:
  name: hello-gpu

  resources:
    gpu: true
    gpu_memory_gb: 8

  execution:
    type: single
    checkpointable: false
    max_runtime_hours: 1

  retry:
    enabled: true
    max_attempts: 2

  script: |
    import torch
    print("Torch version:", torch.__version__)
    print("CUDA available:", torch.cuda.is_available())
    if torch.cuda.is_available():
        print("GPU:", torch.cuda.get_device_name(0))
        x = torch.randn(1000, 1000, device="cuda")
        print("Tensor sum:", x.sum().item())
    print("Hello from Compute Pool!")
