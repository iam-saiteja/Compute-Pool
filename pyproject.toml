[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-pool"
version = "0.1.0"
description = "Pool voluntarily shared Kaggle free-tier GPU compute across multiple accounts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "kaggle>=1.6",
    "pydantic>=2",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
compute-pool = "compute_pool.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["compute_pool*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
