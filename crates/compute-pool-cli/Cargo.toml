[package]
name = "compute-pool-cli"
version = "0.1.0"
edition = "2021"
description = "Native standalone CLI for Compute Pool"

[[bin]]
name = "compute-pool"
path = "src/main.rs"

[dependencies]
compute-pool-core = { path = "../compute-pool-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.38", features = ["full"] }
colored = "2.1"
comfy-table = "7.1"
indicatif = "0.17"
dialoguer = "0.11"
anyhow = "1.0"
open = "5.1"
serde_json = "1.0"
serde_yaml = "0.9"
rustyline = "14.0"
shell-words = "1.1"
dirs = "5.0"
console = "0.15"
reqwest = { version = "0.12", features = ["json"] }
