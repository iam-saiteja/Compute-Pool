# Compute Pool Distributed Job Spec
# Runs across both Slot 1 and Slot 2 in parallel (4x Tesla T4 GPUs total)

job:
  name: distributed-training-poc

  resources:
    gpu: true
    gpu_memory_gb: 15
    nodes: 2

  execution:
    type: distributed_data_parallel
    max_runtime_hours: 1

  script: |
    import os, sys, time, torch
    import torch.nn as nn
    import torch.optim as optim

    rank = int(os.environ.get("CP_NODE_RANK", "0"))
    world_size = int(os.environ.get("CP_WORLD_SIZE", "2"))
    account_user = os.environ.get("KAGGLE_USERNAME", "unknown")

    print("==================================================")
    print(f" [Node {rank}/{world_size}] Starting on {account_user}")
    print(f" CUDA Available : {torch.cuda.is_available()}")
    if torch.cuda.is_available():
        gpu_count = torch.cuda.device_count()
        gpu_name = torch.cuda.get_device_name(0)
        print(f" GPU Device     : {gpu_name} (Total devices: {gpu_count})")
        print(f" VRAM per GPU   : {torch.cuda.get_device_properties(0).total_memory / (1024**3):.1f} GB")
    print("==================================================")

    # Define Neural Network
    class DistributedMLP(nn.Module):
        def __init__(self, in_features=512, hidden=1024, out_features=10):
            super().__init__()
            self.net = nn.Sequential(
                nn.Linear(in_features, hidden),
                nn.ReLU(),
                nn.Linear(hidden, hidden),
                nn.ReLU(),
                nn.Linear(hidden, out_features)
            )
        def forward(self, x):
            return self.net(x)

    device = torch.device("cuda:0" if torch.cuda.is_available() else "cpu")
    model = DistributedMLP().to(device)
    criterion = nn.CrossEntropyLoss()
    optimizer = optim.Adam(model.parameters(), lr=1e-3)

    # Sharded Dataset Partition
    N_SAMPLES = 20000
    BATCH_SIZE = 128
    EPOCHS = 5

    torch.manual_seed(42 + rank)
    X = torch.randn(N_SAMPLES // world_size, 512, device=device)
    y = torch.randint(0, 10, (N_SAMPLES // world_size,), device=device)

    print(f"\nNode {rank}: Training on local shard of {len(X)} samples with batch size {BATCH_SIZE}...")
    start_time = time.time()

    for epoch in range(1, EPOCHS + 1):
        epoch_loss = 0.0
        steps = 0
        permutation = torch.randperm(X.size(0))
        for i in range(0, X.size(0), BATCH_SIZE):
            indices = permutation[i:i+BATCH_SIZE]
            batch_x, batch_y = X[indices], y[indices]

            optimizer.zero_grad()
            outputs = model(batch_x)
            loss = criterion(outputs, batch_y)
            loss.backward()
            optimizer.step()

            epoch_loss += loss.item()
            steps += 1

        avg_loss = epoch_loss / steps
        print(f"  Node {rank} | Epoch {epoch}/{EPOCHS} -> Shard Loss: {avg_loss:.4f}")

    total_time = time.time() - start_time
    samples_per_sec = (len(X) * EPOCHS) / total_time

    print("\n==================================================")
    print(f" Node {rank} Summary:")
    print(f" Total Shard Time   : {total_time:.2f}s")
    print(f" Throughput         : {samples_per_sec:.1f} samples/sec")
    print(f" Local Model State  : {sum(p.numel() for p in model.parameters())} parameters trained on GPU")
    print("==================================================")
